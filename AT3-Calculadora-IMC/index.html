<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculadora simples de Índice de Massa Corporal (IMC).">
    <title>Calculadora de IMC</title>
</head>
<body>
    <main>
        <h1>Calculadora de Índice de Massa Corporal</h1>
        <p>Informe seu peso em quilogramas e sua altura em metros.</p>

        <form id="form-imc">
            <div>
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" name="peso" min="0.1" step="0.1" placeholder="Ex.: 60" required>
            </div>

            <div>
                <label for="altura">Altura (m)</label>
                <input type="number" id="altura" name="altura" min="0.1" max="2.8" step="0.01" placeholder="Ex.: 1.60" required>
            </div>

            <button type="submit">Calcular IMC</button>
        </form>

        <p id="resultado" role="status" aria-live="polite"></p>
        <p><small>O resultado é informativo e não substitui uma avaliação profissional de saúde.</small></p>
    </main>

    <script>
        const formulario = document.getElementById("form-imc");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();

            const peso = Number(document.getElementById("peso").value);
            const altura = Number(document.getElementById("altura").value);

            if (!Number.isFinite(peso) || !Number.isFinite(altura) || peso <= 0 || altura <= 0) {
                resultado.textContent = "Entrada inválida. Informe valores positivos para peso e altura.";
                return;
            }

            const imc = peso / (altura * altura);
            let classificacao;

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc < 25) {
                classificacao = "Peso adequado";
            } else if (imc < 30) {
                classificacao = "Sobrepeso";
            } else if (imc < 35) {
                classificacao = "Obesidade grau I";
            } else if (imc < 40) {
                classificacao = "Obesidade grau II";
            } else {
                classificacao = "Obesidade grau III";
            }

            resultado.textContent = "Seu IMC é " + imc.toFixed(2) + " kg/m² — " + classificacao + ".";
        });
    </script>
</body>
</html>
